name: SaskHandy referral revision build

on:
  push:
    branches:
      - fix/referral-workflow-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused referral tests
        run: pnpm exec vitest run server/referralWorkflowNextAction.test.ts
      - name: Full production build and prerender
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run build
