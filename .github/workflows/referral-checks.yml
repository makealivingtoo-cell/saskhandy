name: Referral staging checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: referral-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: saskhandy_workflow_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:disposable-ci-password@127.0.0.1:3306/saskhandy_workflow_test
      REFERRAL_INTEGRATION_TEST: "true"
      REFERRAL_WORKFLOW_ENABLED: "true"
      STRIPE_SECRET_KEY: sk_test_placeholder
      APP_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable schema
        run: pnpm exec drizzle-kit push --force
      - name: Unit and real database integration checks
        run: pnpm exec vitest run server/referralWorkflow.test.ts server/referralEligibility.test.ts server/referralIntegration.test.ts
      - name: Build client and server
        run: pnpm exec vite build && pnpm exec esbuild server/_core/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Dashboard browser checks with synthetic responses
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
          node scripts/testing/referral-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referral-browser-evidence
          path: test-results/
          if-no-files-found: ignore
