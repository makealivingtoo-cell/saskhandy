name: SaskHandy 2.0 release checks
on:
  push:
    branches: [saskhandy-2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: referral_workflow_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:testpass@127.0.0.1:3306/referral_workflow_ci
      SASKHANDY_V2_MATCHING: "0"
      SASKHANDY_V2_APPOINTMENTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify budget migration twice against legacy rows
        run: |
          node --input-type=module -e 'import mysql from "mysql2/promise"; const db=await mysql.createConnection(process.env.DATABASE_URL); await db.query("CREATE TABLE jobs (id INT PRIMARY KEY, budgetMin DECIMAL(10,2) NOT NULL, budgetMax DECIMAL(10,2) NOT NULL)"); await db.query("INSERT INTO jobs VALUES (1,50,150)"); await db.end()'
          pnpm db:v2-budget
          pnpm db:v2-budget
          node --input-type=module -e 'import mysql from "mysql2/promise"; import assert from "node:assert/strict"; const db=await mysql.createConnection(process.env.DATABASE_URL); await db.query("INSERT INTO jobs VALUES (2,NULL,NULL)"); const [rows]=await db.query("SELECT * FROM jobs ORDER BY id"); assert.equal(rows[0].budgetMin,"50.00"); assert.equal(rows[0].budgetMax,"150.00"); assert.equal(rows[1].budgetMin,null); await db.end()'
      - run: pnpm db:v2-matching
      - run: pnpm db:v2-matching
      - name: Check invitation uniqueness and preserved runs
        run: |
          node --input-type=module -e 'import mysql from "mysql2/promise"; import assert from "node:assert/strict"; const db=await mysql.createConnection(process.env.DATABASE_URL); await db.query("INSERT INTO job_match_runs (jobId) VALUES (1)"); await db.query("INSERT INTO job_match_invitations (jobId,handymanId) VALUES (1,2)"); await assert.rejects(db.query("INSERT INTO job_match_invitations (jobId,handymanId) VALUES (1,2)")); await db.end()'
      - run: pnpm db:v2-appointments
      - run: pnpm db:v2-appointments
      - run: pnpm db:v2-home
      - run: pnpm db:v2-home
      - run: pnpm db:v2-pro
      - run: pnpm db:v2-pro
      - run: pnpm db:v2-booking
      - run: pnpm db:v2-booking
      - run: pnpm db:v2-direct
      - run: pnpm db:v2-direct
      - run: pnpm exec tsx scripts/testing/verify-referral-migration.mts
      - run: pnpm test
      - name: Real MySQL integration checks (isolated database)
        env:
          DATABASE_URL: mysql://root:testpass@127.0.0.1:3306/saskhandy_v2_integration_ci
          SASKHANDY_V2_INTEGRATION: "1"
        run: |
          node --input-type=module -e 'import mysql from "mysql2/promise"; const db=await mysql.createConnection("mysql://root:testpass@127.0.0.1:3306/referral_workflow_ci"); await db.query("CREATE DATABASE saskhandy_v2_integration_ci"); await db.end()'
          pnpm exec tsx scripts/testing/prepare-v2-integration.mts
          pnpm exec vitest run server/v2.integration.test.ts
      - name: Type checking
        if: ${{ !cancelled() }}
        run: pnpm check
      - name: Production build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Desktop and mobile browser smoke checks
        if: ${{ success() }}
        env:
          DATABASE_URL: mysql://root:testpass@127.0.0.1:3306/saskhandy_v2_integration_ci
          SASKHANDY_V2_BROWSER_TEST: "1"
        run: node scripts/testing/v2-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v2-browser-screenshots
          path: artifacts/v2-browser
          if-no-files-found: ignore
